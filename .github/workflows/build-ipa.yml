name: Build AdBloX MESH IPA

on:
  push:
    branches: [main, claude/*]
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  build:
    name: Build IPA
    runs-on: macos-14  # Apple Silicon runner with Xcode 15+

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          ls /Applications/ | grep Xcode
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: |
          xcodegen generate
          echo "Generated project:"
          ls -la *.xcodeproj

      - name: Build app (unsigned for AltStore sideloading)
        working-directory: ios
        run: |
          PROJECT=$(ls -d *.xcodeproj | head -1)
          echo "Building project: $PROJECT"
          xcodebuild -project "$PROJECT" -list

          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "AdBloX" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/AdBloX.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            archive 2>&1 | tee /tmp/build.log

      - name: Show build errors
        if: failure()
        run: |
          echo "============================================"
          echo "SWIFT COMPILATION ERRORS:"
          echo "============================================"
          grep -n "error:" /tmp/build.log | head -30 || echo "No error: lines found"
          echo ""
          echo "============================================"
          echo "LAST 80 LINES OF BUILD LOG:"
          echo "============================================"
          tail -80 /tmp/build.log || echo "No build log found"

      - name: Create IPA from archive
        working-directory: ios
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/AdBloX.xcarchive/Products -name "*.app" -type d | head -1)
          echo "Found app: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/

          cd build
          zip -r AdBloX-MESH-v1.9.3.ipa Payload/
          echo "IPA created: $(ls -lh AdBloX-MESH-v1.9.3.ipa)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdBloX-MESH-IPA
          path: ios/build/AdBloX-MESH-v1.9.3.ipa
          if-no-files-found: error

      - name: Create release (on main branch only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.3-ios
          name: AdBloX MESH v1.9.3 (iOS)
          body: |
            ## AdBloX MESH iOS App

            Install via AltStore:
            1. Download `AdBloX-MESH-v1.9.3.ipa` below
            2. AirDrop or transfer to your iPhone
            3. Open in AltStore

            See [ALTSTORE.md](docs/ALTSTORE.md) for detailed instructions.
          files: ios/build/AdBloX-MESH-v1.9.3.ipa
          draft: false
          prerelease: false
