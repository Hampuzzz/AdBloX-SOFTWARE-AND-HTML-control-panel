<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdBloX MESH — Blocklists</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="app">
    <button class="mobile-toggle" aria-label="Toggle menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
    <div class="sidebar-overlay"></div>

    <aside class="sidebar">
      <div class="sidebar__logo">
        <img src="assets/logo.svg" alt="AdBloX" class="sidebar__logo-icon">
        <div class="sidebar__logo-text">Ad<span>BloX</span> MESH</div>
      </div>
      <nav class="sidebar__nav">
        <a href="index.html" class="sidebar__link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Overview
        </a>
        <a href="devices.html" class="sidebar__link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          Devices
        </a>
        <a href="blocklists.html" class="sidebar__link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L4 7v6c0 5.55 3.84 10.74 8 12 4.16-1.26 8-6.45 8-12V7l-8-5z"/></svg>
          Blocklists
        </a>
        <a href="querylog.html" class="sidebar__link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Query Log
        </a>
        <a href="settings.html" class="sidebar__link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          Settings
        </a>
      </nav>
      <div class="sidebar__footer">
        <div class="sidebar__status">
          <div class="sidebar__status-dot"></div>
          <span>Mesh Connected — v1.8.2</span>
        </div>
      </div>
    </aside>

    <main class="content">
      <div class="content__header">
        <h1 class="content__title">Blocklists</h1>
        <button class="btn btn--primary" onclick="showAddList()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Custom List
        </button>
      </div>

      <div class="card card--no-hover" id="blocklists-container"></div>

      <!-- Add List Modal -->
      <div class="modal-backdrop" id="add-list-modal">
        <div class="modal">
          <div class="modal__header">
            <h3>Add Custom Blocklist</h3>
            <button class="modal__close" onclick="hideAddList()">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <div class="form-group">
            <label>List Name</label>
            <input type="text" id="list-name" placeholder="My Custom List">
          </div>
          <div class="form-group">
            <label>URL (hosts format)</label>
            <input type="url" id="list-url" placeholder="https://example.com/blocklist.txt">
          </div>
          <div class="form-group">
            <label>Description (optional)</label>
            <input type="text" id="list-desc" placeholder="What does this list block?">
          </div>
          <button class="btn btn--primary btn--lg" style="width:100%;" onclick="addList()">Add Blocklist</button>
        </div>
      </div>
    </main>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    let listsData = [];

    async function pageInit() {
      const data = await API.get('/blocklists');
      listsData = data.lists;
      renderLists();
    }

    function renderLists() {
      const container = $('#blocklists-container');
      container.innerHTML = listsData.map((list, i) => `
        <div class="list-item">
          <div class="list-item__info">
            <div>
              <div class="blocklist-row__name">${list.name}</div>
              <div class="blocklist-row__meta">
                <span>${formatNumber(list.entries)} entries</span>
                <span>Updated ${formatTimeAgo(list.updated)}</span>
              </div>
              ${list.description ? `<div style="font-size:0.75rem; color:var(--color-text-muted); margin-top:4px;">${list.description}</div>` : ''}
            </div>
          </div>
          <div class="list-item__actions">
            <label class="toggle">
              <input type="checkbox" ${list.enabled ? 'checked' : ''} onchange="toggleList(${i})">
              <span class="toggle__slider"></span>
            </label>
          </div>
        </div>
      `).join('');
    }

    function toggleList(index) {
      listsData[index].enabled = !listsData[index].enabled;
      API.post('/blocklists/' + listsData[index].id + '/toggle', { enabled: listsData[index].enabled });
    }

    function showAddList() {
      $('#add-list-modal').classList.add('modal-backdrop--visible');
    }

    function hideAddList() {
      $('#add-list-modal').classList.remove('modal-backdrop--visible');
    }

    function addList() {
      const name = $('#list-name').value.trim();
      const url = $('#list-url').value.trim();
      const desc = $('#list-desc').value.trim();
      if (!name || !url) return;

      listsData.push({
        id: 'custom-' + Date.now(),
        name: name,
        description: desc,
        url: url,
        entries: 0,
        enabled: true,
        updated: new Date().toISOString()
      });

      renderLists();
      hideAddList();
      $('#list-name').value = '';
      $('#list-url').value = '';
      $('#list-desc').value = '';
    }
  </script>
</body>
</html>
