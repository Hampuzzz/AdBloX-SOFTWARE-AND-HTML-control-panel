<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdBloX MESH — Query Log</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="app">
    <button class="mobile-toggle" aria-label="Toggle menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
    <div class="sidebar-overlay"></div>

    <aside class="sidebar">
      <div class="sidebar__logo">
        <img src="assets/logo.svg" alt="AdBloX" class="sidebar__logo-icon">
        <div class="sidebar__logo-text">Ad<span>BloX</span> MESH</div>
      </div>
      <nav class="sidebar__nav">
        <a href="index.html" class="sidebar__link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Overview
        </a>
        <a href="devices.html" class="sidebar__link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          Devices
        </a>
        <a href="blocklists.html" class="sidebar__link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L4 7v6c0 5.55 3.84 10.74 8 12 4.16-1.26 8-6.45 8-12V7l-8-5z"/></svg>
          Blocklists
        </a>
        <a href="querylog.html" class="sidebar__link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Query Log
        </a>
        <a href="settings.html" class="sidebar__link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          Settings
        </a>
      </nav>
      <div class="sidebar__footer">
        <div class="sidebar__status">
          <div class="sidebar__status-dot"></div>
          <span>Mesh Connected — v1.8.2</span>
        </div>
      </div>
    </aside>

    <main class="content">
      <div class="content__header">
        <h1 class="content__title">Query Log</h1>
        <span style="font-size:0.8125rem; color:var(--color-text-muted);" id="total-count"></span>
      </div>

      <div class="querylog-filters">
        <div class="search">
          <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" class="search__input" id="search-input" placeholder="Search domains...">
        </div>
        <select id="filter-status">
          <option value="all">All Status</option>
          <option value="blocked">Blocked</option>
          <option value="allowed">Allowed</option>
        </select>
        <select id="filter-device">
          <option value="all">All Devices</option>
        </select>
      </div>

      <div class="card card--no-hover">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Domain</th>
              <th>Type</th>
              <th>Status</th>
              <th>Device</th>
              <th>Matched List</th>
            </tr>
          </thead>
          <tbody id="querylog-body"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    let allEntries = [];

    async function pageInit() {
      const data = await API.get('/querylog');
      allEntries = data.entries;
      $('#total-count').textContent = formatNumber(data.total) + ' total queries';

      // Populate device filter
      const devices = [...new Set(allEntries.map(e => e.device))];
      const deviceSelect = $('#filter-device');
      devices.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        deviceSelect.appendChild(opt);
      });

      renderTable();

      // Filters
      $('#search-input').addEventListener('input', debounce(renderTable, 300));
      $('#filter-status').addEventListener('change', renderTable);
      $('#filter-device').addEventListener('change', renderTable);
    }

    function renderTable() {
      const search = $('#search-input').value.toLowerCase();
      const status = $('#filter-status').value;
      const device = $('#filter-device').value;

      const filtered = allEntries.filter(e => {
        if (search && !e.domain.toLowerCase().includes(search)) return false;
        if (status !== 'all' && e.status !== status) return false;
        if (device !== 'all' && e.device !== device) return false;
        return true;
      });

      const tbody = $('#querylog-body');
      tbody.innerHTML = filtered.map(e => `
        <tr>
          <td style="white-space:nowrap; font-size:0.8125rem;">${formatTime(e.timestamp)}</td>
          <td style="font-family:var(--font-mono); font-size:0.8125rem;">${e.domain}</td>
          <td><span class="badge badge--primary">${e.type}</span></td>
          <td><span class="query-status query-status--${e.status}">${e.status}</span></td>
          <td style="font-size:0.8125rem;">${e.device}</td>
          <td style="font-size:0.8125rem; color:var(--color-text-muted);">${e.list || '—'}</td>
        </tr>
      `).join('');
    }
  </script>
</body>
</html>
