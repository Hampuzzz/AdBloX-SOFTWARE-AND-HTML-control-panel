<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdBloX MESH — Devices</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="app">
    <button class="mobile-toggle" aria-label="Toggle menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
    <div class="sidebar-overlay"></div>

    <aside class="sidebar">
      <div class="sidebar__logo">
        <img src="assets/logo.svg" alt="AdBloX" class="sidebar__logo-icon">
        <div class="sidebar__logo-text">Ad<span>BloX</span> MESH</div>
      </div>
      <nav class="sidebar__nav">
        <a href="index.html" class="sidebar__link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Overview
        </a>
        <a href="devices.html" class="sidebar__link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          Devices
        </a>
        <a href="blocklists.html" class="sidebar__link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L4 7v6c0 5.55 3.84 10.74 8 12 4.16-1.26 8-6.45 8-12V7l-8-5z"/></svg>
          Blocklists
        </a>
        <a href="querylog.html" class="sidebar__link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Query Log
        </a>
        <a href="settings.html" class="sidebar__link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          Settings
        </a>
      </nav>
      <div class="sidebar__footer">
        <div class="sidebar__status">
          <div class="sidebar__status-dot"></div>
          <span>Mesh Connected — v1.8.2</span>
        </div>
      </div>
    </aside>

    <main class="content">
      <div class="content__header">
        <h1 class="content__title">Devices</h1>
        <button class="btn btn--primary" onclick="showAddDevice()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Device
        </button>
      </div>

      <div class="grid grid--cards" id="devices-grid"></div>

      <!-- Add Device Modal -->
      <div class="modal-backdrop" id="add-device-modal">
        <div class="modal">
          <div class="modal__header">
            <h3>Add Device to Mesh</h3>
            <button class="modal__close" onclick="hideAddDevice()">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <div class="qr-container">
            <div id="qr-code" style="background:white; padding:16px; border-radius:8px;"></div>
            <p>Scan this QR code with the AdBloX MESH app on your device to join the mesh network.</p>
            <div class="form-group" style="width:100%;">
              <label>Or copy this enrollment link:</label>
              <input type="text" id="enroll-link" readonly value="https://mesh.adblox.se/join?key=tskey-auth-demo123" onclick="this.select();" style="font-family:var(--font-mono); font-size:0.75rem;">
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    async function pageInit() {
      const data = await API.get('/devices');
      const grid = $('#devices-grid');

      grid.innerHTML = data.devices.map(device => `
        <div class="card">
          <div class="device-card">
            <div class="device-card__icon">${getOSIcon(device.os)}</div>
            <div class="device-card__info">
              <div class="device-card__name">${device.hostname}</div>
              <div class="device-card__ip">${device.ip}</div>
            </div>
            <span class="badge badge--${device.online ? 'success' : 'danger'}">
              <span class="badge__dot"></span>
              ${device.online ? 'Online' : 'Offline'}
            </span>
          </div>
          <div class="device-card__stats">
            <div class="device-card__stat">
              <div class="device-card__stat-value">${formatNumber(device.queries_today)}</div>
              <div class="device-card__stat-label">Queries</div>
            </div>
            <div class="device-card__stat">
              <div class="device-card__stat-value">${formatNumber(device.blocked_today)}</div>
              <div class="device-card__stat-label">Blocked</div>
            </div>
            <div class="device-card__stat">
              <div class="device-card__stat-value">${device.online ? 'Now' : formatTimeAgo(device.last_seen)}</div>
              <div class="device-card__stat-label">Last Seen</div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function showAddDevice() {
      $('#add-device-modal').classList.add('modal-backdrop--visible');
      // Simple QR code placeholder (in production, use qrcode.min.js)
      const qr = $('#qr-code');
      qr.innerHTML = '<svg viewBox="0 0 120 120" width="200" height="200"><rect width="120" height="120" fill="white"/>' +
        '<rect x="10" y="10" width="30" height="30" fill="black"/><rect x="80" y="10" width="30" height="30" fill="black"/>' +
        '<rect x="10" y="80" width="30" height="30" fill="black"/>' +
        '<rect x="15" y="15" width="20" height="20" fill="white"/><rect x="85" y="15" width="20" height="20" fill="white"/>' +
        '<rect x="15" y="85" width="20" height="20" fill="white"/>' +
        '<rect x="20" y="20" width="10" height="10" fill="black"/><rect x="90" y="20" width="10" height="10" fill="black"/>' +
        '<rect x="20" y="90" width="10" height="10" fill="black"/>' +
        '<rect x="50" y="10" width="5" height="5" fill="black"/><rect x="60" y="15" width="5" height="5" fill="black"/>' +
        '<rect x="50" y="50" width="10" height="10" fill="black"/><rect x="65" y="50" width="5" height="5" fill="black"/>' +
        '<rect x="50" y="65" width="5" height="5" fill="black"/><rect x="60" y="70" width="5" height="5" fill="black"/>' +
        '<rect x="80" y="50" width="5" height="5" fill="black"/><rect x="90" y="55" width="5" height="5" fill="black"/>' +
        '<rect x="55" y="80" width="5" height="5" fill="black"/><rect x="65" y="85" width="5" height="5" fill="black"/>' +
        '<rect x="80" y="80" width="10" height="10" fill="black"/><rect x="95" y="80" width="5" height="5" fill="black"/>' +
        '<rect x="100" y="95" width="10" height="10" fill="black"/>' +
        '</svg>';
    }

    function hideAddDevice() {
      $('#add-device-modal').classList.remove('modal-backdrop--visible');
    }
  </script>
</body>
</html>
