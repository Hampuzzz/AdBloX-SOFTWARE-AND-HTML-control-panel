<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdBloX MESH — Overview</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/charts.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="app">
    <!-- Mobile toggle -->
    <button class="mobile-toggle" aria-label="Toggle menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
    <div class="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar__logo">
        <img src="assets/logo.svg" alt="AdBloX" class="sidebar__logo-icon">
        <div class="sidebar__logo-text">Ad<span>BloX</span> MESH</div>
      </div>
      <nav class="sidebar__nav">
        <a href="index.html" class="sidebar__link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Overview
        </a>
        <a href="devices.html" class="sidebar__link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          Devices
        </a>
        <a href="blocklists.html" class="sidebar__link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L4 7v6c0 5.55 3.84 10.74 8 12 4.16-1.26 8-6.45 8-12V7l-8-5z"/></svg>
          Blocklists
        </a>
        <a href="querylog.html" class="sidebar__link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Query Log
        </a>
        <a href="settings.html" class="sidebar__link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          Settings
        </a>
      </nav>
      <div class="sidebar__footer">
        <div class="sidebar__status">
          <div class="sidebar__status-dot"></div>
          <span>Mesh Connected — v1.8.2</span>
        </div>
      </div>
    </aside>

    <!-- Content -->
    <main class="content">
      <div class="content__header">
        <h1 class="content__title">Overview</h1>
        <span style="font-size:0.8125rem; color:var(--color-text-muted);" id="last-updated"></span>
      </div>

      <!-- Stats -->
      <div class="grid grid--stats" id="stats-grid">
        <div class="card stat-card">
          <div class="stat-card__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          </div>
          <div class="stat-card__value" id="stat-queries">—</div>
          <div class="stat-card__label">Queries Today</div>
        </div>
        <div class="card stat-card">
          <div class="stat-card__icon" style="background:rgba(255,68,102,0.15); color:#ff4466;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L4 7v6c0 5.55 3.84 10.74 8 12 4.16-1.26 8-6.45 8-12V7l-8-5z"/></svg>
          </div>
          <div class="stat-card__value" id="stat-blocked">—</div>
          <div class="stat-card__label">Blocked <span id="stat-percent" style="color:var(--color-danger);"></span></div>
        </div>
        <div class="card stat-card">
          <div class="stat-card__icon" style="background:rgba(0,255,136,0.15); color:#00ff88;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          </div>
          <div class="stat-card__value" id="stat-devices">—</div>
          <div class="stat-card__label">Devices Online</div>
        </div>
        <div class="card stat-card">
          <div class="stat-card__icon" style="background:rgba(255,170,0,0.15); color:#ffaa00;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
          </div>
          <div class="stat-card__value" id="stat-uptime">—</div>
          <div class="stat-card__label">Uptime</div>
        </div>
      </div>

      <!-- Chart -->
      <div class="card card--no-hover" style="margin-top:var(--space-lg);">
        <div class="chart-header">
          <h3>DNS Queries — Last 24 Hours</h3>
          <div class="chart-legend">
            <div class="chart-legend__item">
              <div class="chart-legend__dot" style="background:#00d4ff;"></div> Total
            </div>
            <div class="chart-legend__item">
              <div class="chart-legend__dot" style="background:#ff4466;"></div> Blocked
            </div>
          </div>
        </div>
        <div class="chart-container">
          <canvas id="queries-chart"></canvas>
        </div>
      </div>

      <!-- Recent Activity -->
      <div class="card card--no-hover" style="margin-top:var(--space-lg);">
        <h3>Recent Activity</h3>
        <div class="activity-list" id="activity-list"></div>
      </div>
    </main>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
  <script>
    let chart;

    async function pageInit() {
      await loadStats();
      setInterval(loadStats, 30000);
    }

    async function loadStats() {
      const data = await API.get('/stats');

      $('#stat-queries').textContent = formatNumber(data.queries_today);
      $('#stat-blocked').textContent = formatNumber(data.blocked_today);
      $('#stat-percent').textContent = '(' + data.blocked_percent + '%)';
      $('#stat-devices').textContent = data.devices_online + '/' + data.devices_total;
      $('#stat-uptime').textContent = formatUptime(data.uptime_seconds);
      $('#last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();

      // Chart
      if (!chart) {
        chart = new MeshChart(document.getElementById('queries-chart'));
      }
      chart.setData(data.queries_over_time);

      // Activity list
      const list = $('#activity-list');
      list.innerHTML = data.recent_activity.map(item => `
        <div class="activity-item">
          <span class="badge badge--${item.status === 'blocked' ? 'danger' : 'success'}" style="width:70px; justify-content:center;">
            ${item.status}
          </span>
          <span class="activity-item__domain">${item.domain}</span>
          <span style="font-size:0.75rem; color:var(--color-text-muted);">${item.device}</span>
          <span class="activity-item__time">${item.time}</span>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
